apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-secret-replicator
  namespace: lang-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-replicator
rules:
  # Kopf watches customresourcedefinitions to discover the CRD schema
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Watch SecretReplicator CRs anywhere
  - apiGroups: ["kopf.dev"]
    resources: ["secretreplicators"]
    verbs: ["get", "list", "watch"]
  # Kopf patches CRs to add finalizers and report status
  - apiGroups: ["kopf.dev"]
    resources: ["secretreplicators"]
    verbs: ["create", "update", "patch"]
  # Read source secrets from any namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Create/update/delete replicated secrets in any namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  # Events for Kopf progress reporting
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-replicator-binding
subjects:
  - kind: ServiceAccount
    name: sa-secret-replicator
    namespace: lang-app
roleRef:
  kind: ClusterRole
  name: secret-replicator
  apiGroup: rbac.authorization.k8s.io
