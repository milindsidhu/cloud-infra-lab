# HTTP-only origin ingress for ArgoCD when Cloudflare proxy/TLS terminates at Cloudflare.
# For direct TLS termination at the ingress, switch to backend-protocol: HTTPS and
# enable ssl-redirect/ssl-passthrough.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-for-argocd
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/hostname: argocd<domain>
    external-dns.alpha.kubernetes.io/target: edf03371-7be3-4673-aeae-4baf7c76fd57.cfargotunnel.com
spec:
  ingressClassName: nginx
  rules:
  - host: argocd<domain>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              name: http
