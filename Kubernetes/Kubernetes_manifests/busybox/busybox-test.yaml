apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-app
  template:
    metadata:
      labels:
        app: busybox-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: busybox
        image: busybox:1.38.0
        command:
        - sh
        - -c
        - |
          while true; do echo -e "HTTP/1.1 200 OK\n\nHey User! You did it." | nc -l -p 8080; done
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "50m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: busybox-service
  namespace: demo
spec:
  selector:
    app: busybox-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: busybox-ingress
  namespace: demo
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/hostname: busybox.<DOMAIN>
    external-dns.alpha.kubernetes.io/target: <CLOUDFLARE_TUNNEL_ID>.cfargotunnel.com
spec:
  ingressClassName: nginx
  # tls:
  # - hosts:
  #   - busybox<domain>
  #   secretName: multi-cert-self-secret 
  rules:
  - host: busybox<domain>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: busybox-service
            port:
              number: 80
