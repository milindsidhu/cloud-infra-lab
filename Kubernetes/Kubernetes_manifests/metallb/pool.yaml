# WARNING: pick a range that does NOT overlap with your DHCP pool or other
# active devices on the LAN. The range below is an example only.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: my-pool
  namespace: metallb
spec:
  addresses:
  - 192.168.1.12-192.168.1.20
  autoAssign: true