# Placeholder Secret. The replicator will overwrite .dockerconfigjson from the
# source secret once the annotation matches. With namespaceController the source
# secret lives in the central namespace (registry-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: my-docker-secret
  annotations:
    replicator.v1.mittwald.de/replicate-from: registry-secrets/my-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K