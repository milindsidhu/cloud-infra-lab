
# This file defines the Role and RoleBinding for the lang-app namespace.
# It grants permissions to manage jobs, pods, and configmaps within the namespace.


apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-pod-role
  namespace: lang-app
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]

---

# This file defines the RoleBinding for the lang-app namespace.

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-pod-rolebinding
  namespace: lang-app
subjects:
  - kind: ServiceAccount
    name: sa-lang-app
    namespace: lang-app
roleRef:
  kind: Role
  name: job-pod-role
  apiGroup: rbac.authorization.k8s.io
