apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-pod-manager
rules:
  # Permission to create jobs in any namespace
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  
  # Permission to list/exec pods and fetch logs in any namespace
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-pod-manager-binding
subjects:
  - kind: ServiceAccount
    name: sa-lang-app
    namespace: lang-app
roleRef:
  kind: ClusterRole
  name: job-pod-manager
  apiGroup: rbac.authorization.k8s.io
