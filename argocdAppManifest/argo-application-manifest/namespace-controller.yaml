apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-controller
spec:
  destination:
    namespace: namespace-controller
    server: https://kubernetes.default.svc
  source:
    path: HelmCharts/live/namespaceController
    repoURL: https://github.com/milindsidhu/Projects.git
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
  revisionHistoryLimit: 5
