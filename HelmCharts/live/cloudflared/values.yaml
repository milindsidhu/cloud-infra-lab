# Managed by namespace-controller - do not create namespace or SA here
serviceAccount:
  name: sa-cloudflared

imagePullSecret: my-registry-secret

tunnels:
  k8sApi:
    enabled: true
    tunnelID: <CLOUDFLARE_TUNNEL_ID>
    hostname: k8s-api.<DOMAIN>
    service: https://kubernetes.default.svc.cluster.local:443
    noTLSVerify: true
    secretName: tunnel-credentials

  ssh:
    enabled: true
    tunnelID: <CLOUDFLARE_TUNNEL_ID>
    hostname: sshmaster.<DOMAIN>
    service: ssh://<SSH_HOST>:22
    noTLSVerify: false
    secretName: ssh-tunnel-credentials

image:
  repository: cloudflare/cloudflared
  tag: "2025.4.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 5
