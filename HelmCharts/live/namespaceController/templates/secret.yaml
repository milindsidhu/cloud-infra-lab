{{/*
  Shared image-pull secret in the central namespace, at sync-wave -1
  (after the namespace at -2, before the PostSync annotation patch).
  Source of truth is values.yaml — real creds arrive via --set or a
  secrets manager, never committed. dockerConfigJson may be supplied
  verbatim to skip the field-by-field construction.
*/}}
{{- if .Values.createPatchJob.enabled }}
{{- $ns := .Values.centralSecretNamespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ns.secretName }}
  namespace: {{ $ns.name }}
  labels:
    app.kubernetes.io/managed-by: namespace-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/dockerconfigjson
data:
{{- if $ns.dockerConfigJson }}
  .dockerconfigjson: {{ $ns.dockerConfigJson | b64enc | quote }}
{{- else }}
{{- $auth := printf "%s:%s" $ns.dockerUsername $ns.dockerPassword | b64enc }}
{{- $cfg := printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" $ns.dockerServer $ns.dockerUsername $ns.dockerPassword $ns.dockerEmail $auth }}
  .dockerconfigjson: {{ $cfg | b64enc | quote }}
{{- end }}
{{- end }}
